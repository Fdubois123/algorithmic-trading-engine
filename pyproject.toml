[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-trading-engine"
version = "1.0.0"
description = "A modular Python framework for quantitative strategy research, backtesting, portfolio analysis, and risk management."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Saptarshi Maiti" }
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["trading_engine"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
precision = 1